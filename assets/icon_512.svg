<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle squircle shape -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1E293B" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1E293B" stroke-width="3"/>

  <!-- Glowing Outer Eye Contour (Upper & Lower) -->
  <path d="M 110,256 C 160,160 352,160 402,256 C 352,352 160,352 110,256 Z" 
        fill="none" stroke="url(#eyeGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Eye Corner Data Nodes -->
  <circle cx="110" cy="256" r="12" fill="#00E5FF"/>
  <circle cx="402" cy="256" r="12" fill="#00E5FF"/>

  <!-- Iris Structure -->
  <circle cx="256" cy="256" r="76" fill="#0A192F" stroke="#00E5FF" stroke-width="10"/>
  <circle cx="256" cy="256" r="48" fill="url(#irisGrad)"/>

  <!-- Pupil & Lens -->
  <circle cx="256" cy="256" r="28" fill="#00E5FF" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="14" fill="#FFFFFF"/>

  <!-- Top & Bottom Signal Arcs -->
  <path d="M 210,120 C 235,110 277,110 302,120" fill="none" stroke="#6366F1" stroke-width="8" stroke-linecap="round"/>
  <path d="M 210,392 C 235,402 277,402 302,392" fill="none" stroke="#6366F1" stroke-width="8" stroke-linecap="round"/>
</svg>
